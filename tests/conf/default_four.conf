# =============================================================
#  default.conf  —  4 virtual servers, all plain HTTP
# =============================================================

# ─────────────────────────────────────────
# SERVER 1 — "one"  on port 8080
# ─────────────────────────────────────────
server {
    listen          8080;
    host            127.0.0.1;
    server_name     one;

    clientMaxBodySize    1048576;    # 1MB

    error_page      400     /errors/400.html;
    error_page      403     /errors/403.html;
    error_page      404     /errors/404.html;
    error_page      500     /errors/500.html;

    location / {
        root            ./www/one;
        index           index.html;
        autoindex       off;
        allowedMethod   GET POST;
    }

    location /static {
        root            ./www/static;
        autoindex       on;
        allowedMethod GET;
    }

    location /upload {
        root                ./www/uploads;
        allowedMethod     GET POST DELETE;
        clientMaxBodySize 10485760;   # 10MB override
        upload_path         ./www/one/uploads;
    }

    location /game_start {
        root ./www/one/pages;
        index game-start.html;
        autoindex off;
        allowedMethod GET;
    }

    location /cgi-bin {
        root            ./www/one/cgi-bin;
        cgi_extension   .py;
        cgi_pass        /usr/bin/python3;
        allowedMethod GET POST;
    }
}

# ─────────────────────────────────────────
# SERVER 2 — "two"  on port 8081
# ─────────────────────────────────────────
server {
    listen          8081;
    host            127.0.0.1;
    server_name     two;

    clientMaxBodySize    512000;     # 500KB

    error_page      400     /errors/400.html;
    error_page      403     /errors/403.html;
    error_page      404     /errors/404.html;
    error_page      500     /errors/500.html;

    location / {
        root            ./www/two;
        index           index.html;
        autoindex       off;
        allowedMethod   GET;
    }

    location /old {
        return          301 /;
        allowedMethod   GET;
    }
}

# ─────────────────────────────────────────
# SERVER 3 — "three"  on port 8082
# ─────────────────────────────────────────
server {
    listen          8082;
    host            127.0.0.1;
    server_name     three;

    clientMaxBodySize    2097152;    # 2MB

    error_page      400     /errors/400.html;
    error_page      403     /errors/403.html;
    error_page      404     /errors/404.html;
    error_page      500     /errors/500.html;

    location / {
        root            ./www/one;
        index           index.html;
        autoindex       off;
        allowedMethod   GET POST;
    }

    location /upload {
        root                ./www/one/uploads;
        allowedMethod     POST DELETE;
        clientMaxBodySize 5242880;   # 5MB override
        upload_path         ./www/one/uploads;
    }

    location /cgi-bin {
        root            ./www/one/cgi-bin;
        cgi_extension   .php;
        cgi_pass        /usr/bin/php-cgi;
        allowedMethod GET POST;
    }

    location /docs {
        root            ./www/one/docs;
        autoindex       on;
        allowedMethod GET;
    }
}

# ─────────────────────────────────────────
# SERVER 4 — "four"  on port 8083
# (same port as "three" — differentiated by server_name)
# ─────────────────────────────────────────
server {
    listen          8083;
    host            127.0.0.1;
    server_name     four;

    clientMaxBodySize    1048576;    # 1MB

    error_page      400     /errors/400.html;
    error_page      403     /errors/403.html;
    error_page      404     /errors/404.html;
    error_page      500     /errors/500.html;

    location / {
        root            ./www/errors;
        autoindex       on;
        allowedMethod GET;
    }
}

# How virtual hosting works on the same port

# Two servers sharing port `8080` is fine — the server picks which one to use via the `Host:` header the browser sends:

# Request arrives on port 8080
#         │
#         ▼
# Host: one        →  serve SERVER 1
# Host: two        →  serve SERVER 2
# Host: unknown    →  serve first server block (default)

# To test locally, add to `/etc/hosts`:
# 127.0.0.1   one
# 127.0.0.1   two
# 127.0.0.1   three
# 127.0.0.1   four