# signal_test.conf — minimal server for test_signals.py
# Port 19091 (avoids collision with test_err_codes.conf on 19090)

server {
    listen          19091;
    host            127.0.0.1;
    server_name     signaltest;

    location / {
        root            ./www/one;
        index           /index.html;
        allowedMethod   GET;
    }

    # CGI needed by test_sigterm_during_cgi: slow.py sleeps 10 s
    location /cgi-bin {
        root            ./tests/cgi-bin;
        cgi_extension   .py;
        cgi_pass        /usr/bin/python3;
        allowedMethod   GET;
    }
}
